<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop - Products</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/products.html">Demo Shop</a>
    <nav>
      <a href="/cart.html" data-testid="cart-link">Cart <span class="badge" data-testid="cart-badge" hidden></span></a>
      <button type="button" id="logout" class="link-button">Log out</button>
    </nav>
  </header>
  <main>
    <div class="page-title">
      <h1>Products</h1>
      <div>
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="name-asc">Name (A to Z)</option>
          <option value="name-desc">Name (Z to A)</option>
          <option value="price-asc">Price (low to high)</option>
          <option value="price-desc">Price (high to low)</option>
        </select>
      </div>
    </div>
    <p id="status" data-testid="status-message">Loading products...</p>
    <ul id="product-list" class="product-list"></ul>
  </main>
  <script src="/shop.js"></script>
  <script>
    Shop.requireLogin();
    Shop.renderHeader();

    const list = document.getElementById('product-list');
    const status = document.getElementById('status');
    const sort = document.getElementById('sort');
    let products = [];

    const sorters = {
      'name-asc': (a, b) => a.name.localeCompare(b.name),
      'name-desc': (a, b) => b.name.localeCompare(a.name),
      'price-asc': (a, b) => a.price - b.price,
      'price-desc': (a, b) => b.price - a.price,
    };

    function render() {
      list.innerHTML = '';
      for (const product of [...products].sort(sorters[sort.value])) {
        const card = document.createElement('li');
        card.className = 'product-card';
        card.dataset.testid = 'product-card';
        card.innerHTML = '<h2 data-testid="product-name"></h2><p class="price" data-testid="product-price"></p><button type="button"></button>';
        card.querySelector('h2').textContent = product.name;
        card.querySelector('.price').textContent = Shop.formatPrice(product.price);
        const button = card.querySelector('button');
        button.textContent = Shop.isInCart(product.id) ? 'Remove' : 'Add to cart';
        button.onclick = () => {
          if (Shop.isInCart(product.id)) Shop.removeFromCart(product.id);
          else Shop.addToCart(product);
          render();
        };
        list.append(card);
      }
    }

    sort.addEventListener('change', render);

    fetch('/api/products')
      .then((response) => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then((data) => {
        products = data;
        status.textContent = 'No products available.';
        status.hidden = products.length > 0;
        render();
      })
      .catch(() => {
        status.textContent = 'Could not load products. Please try again later.';
        status.setAttribute('role', 'alert');
      });
  </script>
</body>
</html>
